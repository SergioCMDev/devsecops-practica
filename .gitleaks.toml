title = "Gitleaks config"

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key","aws"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws(.{0,20})?(secret|secret_access_key|access_key).*[:=]\s*([A-Za-z0-9/+=]{40,})'''
tags = ["key","aws","secret"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key (40+ chars base64/hex)"
regex = '''(?i)(api[_-]?key|secret|token)[^a-zA-Z0-9]{0,3}([A-Za-z0-9_\-]{20,})'''
tags = ["key","token"]

[[rules]]
id = "private-key"
description = "Private key block"
regex = '''-----BEGIN PRIVATE KEY-----'''
tags = ["key","private"]

[[rules]]
id = "ssh-private-key"
description = "SSH private key block"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
tags = ["key","private"]